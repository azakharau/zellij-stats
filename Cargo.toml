[package]
name = "zellij-stats"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One-shot CPU and RAM segment generator for Zellij-style status bars."
repository = "https://github.com/azakharau/zellij-stats"

[dependencies]
sysinfo = "0.37"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
